<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" style="background:#0a4a4a">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a4a4a"/>
      <stop offset="100%" stop-color="#0d5c5c"/>
    </linearGradient>
    <!-- Gold gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4913a"/>
      <stop offset="100%" stop-color="#f0b865"/>
    </linearGradient>
    <!-- Teal accent -->
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <!-- Skin tone -->
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4956a"/>
      <stop offset="100%" stop-color="#c07a4a"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.04" stroke="white" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>

  <!-- Large decorative circle background -->
  <circle cx="420" cy="250" r="220" fill="rgba(13,148,136,0.08)"/>
  <circle cx="420" cy="250" r="170" fill="rgba(13,148,136,0.06)"/>

  <!-- Gold accent arc top right -->
  <path d="M 620 30 Q 780 80 760 220" stroke="url(#gold)" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M 640 10 Q 800 60 790 230" stroke="url(#gold)" stroke-width="1" fill="none" opacity="0.2"/>

  <!-- Floor line -->
  <rect x="120" y="410" width="560" height="3" rx="2" fill="rgba(13,148,136,0.3)"/>
  <rect x="120" y="413" width="560" height="40" fill="url(#teal)" opacity="0.08"/>

  <!-- === THERAPY TABLE / BED === -->
  <!-- Table legs -->
  <rect x="175" y="330" width="14" height="82" rx="4" fill="#0d5c5c"/>
  <rect x="355" y="330" width="14" height="82" rx="4" fill="#0d5c5c"/>
  <!-- Table surface -->
  <rect x="155" y="295" width="240" height="40" rx="8" fill="#0f6b6b"/>
  <rect x="155" y="295" width="240" height="12" rx="6" fill="#14b8a6" opacity="0.4"/>
  <!-- Table padding -->
  <rect x="160" y="300" width="230" height="28" rx="5" fill="#0d9488" opacity="0.3"/>

  <!-- === PATIENT lying on table === -->
  <!-- Legs (horizontal, lying down) -->
  <rect x="300" y="272" width="90" height="26" rx="13" fill="url(#skin)"/>
  <!-- Right leg bent (sitting up slightly) -->
  <path d="M 320 285 Q 345 285 355 270 Q 360 260 370 265 Q 380 270 375 280 Q 370 290 355 292 L 320 292 Z" fill="url(#skin)"/>

  <!-- Torso (person slightly reclined) -->
  <ellipse cx="245" cy="272" rx="58" ry="22" fill="#0d9488" opacity="0.9"/>
  <!-- Shirt -->
  <path d="M 188 272 Q 185 250 245 248 Q 305 250 302 272 Q 305 294 245 296 Q 185 294 188 272Z" fill="#0d9488"/>
  <!-- Shirt collar -->
  <path d="M 235 252 L 245 262 L 255 252" stroke="#14b8a6" stroke-width="2" fill="none"/>

  <!-- Head -->
  <ellipse cx="175" cy="258" rx="28" ry="32" fill="url(#skin)"/>
  <!-- Hair -->
  <path d="M 148 245 Q 150 215 175 212 Q 200 215 202 245 Q 195 230 175 228 Q 155 230 148 245Z" fill="#2d1a0a"/>
  <!-- Face features -->
  <ellipse cx="167" cy="255" rx="4" ry="4.5" fill="#1a0a00" opacity="0.7"/>
  <ellipse cx="183" cy="255" rx="4" ry="4.5" fill="#1a0a00" opacity="0.7"/>
  <path d="M 168 268 Q 175 274 182 268" stroke="#c07a4a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Smile/expression -->
  <path d="M 164 253 Q 167 251 170 253" stroke="#1a0a00" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M 180 253 Q 183 251 186 253" stroke="#1a0a00" stroke-width="1" fill="none" opacity="0.5"/>

  <!-- Patient arm raised (doing exercise) -->
  <path d="M 230 260 Q 215 235 205 215 Q 200 205 215 200 Q 225 198 228 210 Q 230 225 240 248" stroke="url(#skin)" stroke-width="16" fill="none" stroke-linecap="round"/>
  <!-- Hand -->
  <ellipse cx="213" cy="198" rx="12" ry="10" fill="url(#skin)"/>

  <!-- === THERAPIST === -->
  <!-- Therapist legs -->
  <rect x="480" y="330" width="22" height="80" rx="8" fill="#1a3a4a"/>
  <rect x="510" y="330" width="22" height="80" rx="8" fill="#1a3a4a"/>
  <!-- Shoes -->
  <ellipse cx="491" cy="412" rx="16" ry="7" fill="#0a1a24"/>
  <ellipse cx="521" cy="412" rx="16" ry="7" fill="#0a1a24"/>
  <!-- Therapist torso - white coat -->
  <path d="M 465 220 Q 462 310 465 330 L 545 330 Q 548 310 545 220 Z" fill="#e8f4f4"/>
  <!-- Coat details -->
  <line x1="505" y1="225" x2="505" y2="325" stroke="#cce0e0" stroke-width="1.5"/>
  <!-- Pocket -->
  <rect x="468" y="265" width="22" height="16" rx="3" fill="#d0e8e8" stroke="#cce0e0" stroke-width="1"/>
  <!-- Stethoscope -->
  <path d="M 475 240 Q 468 255 472 268 Q 476 278 486 276" stroke="#0d9488" stroke-width="2.5" fill="none"/>
  <circle cx="486" cy="276" r="6" fill="#0d9488"/>
  <!-- Scrubs underneath -->
  <rect x="480" y="310" width="50" height="22" rx="4" fill="#0d9488" opacity="0.4"/>

  <!-- Therapist arm extending to patient -->
  <path d="M 465 260 Q 440 270 415 282 Q 400 290 392 300" stroke="#d4956a" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Therapist hand on patient leg -->
  <ellipse cx="390" cy="300" rx="14" ry="10" fill="#d4956a"/>

  <!-- Other arm (therapist clipboard) -->
  <path d="M 545 250 Q 568 245 575 240" stroke="#d4956a" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- Clipboard -->
  <rect x="565" y="218" width="48" height="62" rx="5" fill="white" opacity="0.9"/>
  <rect x="565" y="218" width="48" height="12" rx="3" fill="#0d9488"/>
  <rect x="583" y="212" width="14" height="12" rx="3" fill="#0d9488" opacity="0.7"/>
  <!-- Clipboard lines -->
  <line x1="572" y1="240" x2="607" y2="240" stroke="#ddd" stroke-width="1.5"/>
  <line x1="572" y1="249" x2="607" y2="249" stroke="#ddd" stroke-width="1.5"/>
  <line x1="572" y1="258" x2="600" y2="258" stroke="#ddd" stroke-width="1.5"/>
  <line x1="572" y1="267" x2="604" y2="267" stroke="#ddd" stroke-width="1.5"/>

  <!-- Therapist head -->
  <ellipse cx="505" cy="192" rx="30" ry="34" fill="#d4956a"/>
  <!-- Hair -->
  <path d="M 476 180 Q 478 148 505 145 Q 532 148 534 180 Q 524 160 505 158 Q 486 160 476 180Z" fill="#2d1a0a"/>
  <!-- Hair sides -->
  <path d="M 476 180 Q 472 195 476 205" stroke="#2d1a0a" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M 534 180 Q 538 195 534 205" stroke="#2d1a0a" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Face -->
  <ellipse cx="497" cy="190" rx="4" ry="4.5" fill="#1a0a00" opacity="0.75"/>
  <ellipse cx="513" cy="190" rx="4" ry="4.5" fill="#1a0a00" opacity="0.75"/>
  <path d="M 498 204 Q 505 210 512 204" stroke="#c07a4a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Glasses -->
  <rect x="490" y="185" width="10" height="8" rx="3" fill="none" stroke="#0d9488" stroke-width="1.5"/>
  <rect x="505" y="185" width="10" height="8" rx="3" fill="none" stroke="#0d9488" stroke-width="1.5"/>
  <line x1="500" y1="189" x2="505" y2="189" stroke="#0d9488" stroke-width="1.5"/>
  <line x1="490" y1="189" x2="487" y2="190" stroke="#0d9488" stroke-width="1.5"/>
  <line x1="515" y1="189" x2="518" y2="190" stroke="#0d9488" stroke-width="1.5"/>

  <!-- === DECORATIVE ELEMENTS === -->
  <!-- Progress arc (patient improvement indicator) -->
  <circle cx="680" cy="120" r="55" fill="none" stroke="rgba(13,148,136,0.15)" stroke-width="8"/>
  <path d="M 680 65 A 55 55 0 0 1 725 148" stroke="url(#teal)" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="680" cy="65" r="5" fill="url(#gold)" filter="url(#glow)"/>
  <text x="680" y="115" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="white">78%</text>
  <text x="680" y="133" text-anchor="middle" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" letter-spacing="1">RECOVERY</text>

  <!-- Floating stat cards -->
  <!-- Card 1: Sessions -->
  <rect x="40" y="140" width="130" height="70" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(13,148,136,0.3)" stroke-width="1"/>
  <text x="105" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="700" fill="url(#gold)">12</text>
  <text x="105" y="184" text-anchor="middle" font-family="sans-serif" font-size="9" fill="rgba(255,255,255,0.5)" letter-spacing="1">SESSIONS</text>
  <text x="105" y="198" text-anchor="middle" font-family="sans-serif" font-size="9" fill="rgba(255,255,255,0.35)" letter-spacing="1">COMPLETED</text>

  <!-- Card 2: Pain reduction -->
  <rect x="40" y="230" width="130" height="70" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(212,145,58,0.3)" stroke-width="1"/>
  <text x="105" y="258" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="700" fill="url(#teal)">85%</text>
  <text x="105" y="274" text-anchor="middle" font-family="sans-serif" font-size="9" fill="rgba(255,255,255,0.5)" letter-spacing="1">PAIN</text>
  <text x="105" y="288" text-anchor="middle" font-family="sans-serif" font-size="9" fill="rgba(255,255,255,0.35)" letter-spacing="1">REDUCTION</text>

  <!-- Heartbeat / activity line -->
  <polyline points="40,360 80,360 95,330 110,385 125,345 145,360 190,360" stroke="url(#teal)" stroke-width="2" fill="none" filter="url(#glow)"/>
  <circle cx="145" cy="345" r="4" fill="url(#gold)" filter="url(#glow)"/>

  <!-- Brand text bottom -->
  <text x="400" y="472" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="rgba(255,255,255,0.2)" letter-spacing="3">MAWENA ASSETS LLC · REHABILITATION THERAPY</text>

  <!-- Decorative dots top left -->
  <circle cx="60" cy="60" r="3" fill="url(#teal)" opacity="0.4"/>
  <circle cx="80" cy="50" r="2" fill="url(#gold)" opacity="0.4"/>
  <circle cx="100" cy="70" r="2" fill="url(#teal)" opacity="0.3"/>
  <circle cx="70" cy="85" r="1.5" fill="url(#gold)" opacity="0.3"/>

  <!-- Light rays from top -->
  <line x1="400" y1="0" x2="200" y2="500" stroke="rgba(255,255,255,0.015)" stroke-width="60"/>
  <line x1="500" y1="0" x2="650" y2="500" stroke="rgba(255,255,255,0.01)" stroke-width="40"/>
</svg>